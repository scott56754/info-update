kind = "web"
previewPath = "/"
title = "Info Form"
version = "1.0.0"
id = "artifacts/info-form"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19035

[services.development]
run = "pnpm --filter @workspace/info-form run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/info-form", "run", "build" ]
publicDir = "artifacts/info-form/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19035"
BASE_PATH = "/"
